<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:transparent; user-select:none; }
  .card { background:rgba(20,20,40,0.96); border:1px solid #4c1d95; border-radius:14px;
          padding:14px 16px; color:#e0e0ff; box-shadow:0 8px 30px rgba(0,0,0,0.6); }
  .head { font-size:14px; font-weight:600; margin-bottom:8px; }
  .tools { max-height:130px; overflow-y:auto; }
  .tool { padding:6px 10px; background:rgba(255,255,255,0.05); border-radius:8px; margin-bottom:6px; font-size:12px; }
  .tool b { color:#cbd5e1; }
  .risk { color:#f87171; font-size:11px; }
  .desc { color:#94a3b8; margin-top:2px; }
  .hint { font-size:11px; color:#8888bb; margin:8px 0; }
  .btns { display:flex; gap:8px; }
  .btn { flex:1; padding:8px 0; border:none; border-radius:8px; font-size:13px; cursor:pointer; color:#fff; }
  .allow { background:#16a34a; }
  .deny  { background:#dc2626; }
  .sent  { opacity:0.5; pointer-events:none; }
</style>
</head>
<body>
<div class="card">
  <div class="head">🔧 爱弥斯想执行 <span id="count">0</span> 个操作</div>
  <div class="tools" id="tools"></div>
  <div class="hint">⌨ 全局键（无需切窗口）：<b>F8</b>全部允许 · <b>F7</b>全部拒绝</div>
  <div class="btns">
    <button class="btn deny" id="btn-deny">拒绝全部</button>
    <button class="btn allow" id="btn-allow">全部允许</button>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  let data = { requestId: '', toolCalls: [] };
  try { data = JSON.parse(params.get('data') || '{}'); } catch (e) {}

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  document.getElementById('count').textContent = (data.toolCalls || []).length;
  const toolsEl = document.getElementById('tools');
  (data.toolCalls || []).forEach(tc => {
    const div = document.createElement('div');
    div.className = 'tool';
    const risk = tc.t3 ? ' <span class="risk">⚠高风险</span>' : '';
    div.innerHTML = `<b>${esc(tc.name)}</b>${risk}` +
      `<div class="desc">${esc(tc.description || JSON.stringify(tc.args || {}))}</div>`;
    toolsEl.appendChild(div);
  });

  function sendDecision(approve, onlyNonT3) {
    const ids = (data.toolCalls || []).filter(tc => !onlyNonT3 || !tc.t3).map(tc => tc.tool_call_id);
    if (window.electronAPI && window.electronAPI.sendToolConfirmDecision) {
      window.electronAPI.sendToolConfirmDecision({ requestId: data.requestId, toolCallIds: ids, approve });
    }
    document.querySelectorAll('.btn').forEach(b => b.classList.add('sent'));
    setTimeout(() => window.close(), 400);
  }

  document.getElementById('btn-allow').onclick = () => sendDecision(true, false);
  document.getElementById('btn-deny').onclick  = () => sendDecision(false, false);

  if (window.electronAPI && window.electronAPI.onApprovalHotkey) {
    window.electronAPI.onApprovalHotkey((action) => {
      if (action === 'approve') sendDecision(true, false);
      else if (action === 'deny') sendDecision(false, false);
    });
  }
  setTimeout(() => window.close(), 65000);   // 服务端60秒自动拒绝，这里兜底
</script>
</body>
</html>
