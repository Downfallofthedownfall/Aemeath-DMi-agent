# ============================================================
# profiles/aemeath-run/cordis.patch.yml — 一次性运行 profile（基准/冒烟，headless）
# 与 aemeath 主 profile 共享同样插件配置；headless 无 Web 层。
# 关键：agent-presets default=physicist（headless runner 的 agent 走默认 preset，
#       使 worldbook/讲义/记忆按 physicist 注入）；headless bundle 需补 storage 三件套。
# ============================================================
# —— agent-presets 默认预设：physicist（headless 一次性运行按 physicist 人格/知识注入）——
- id: agent-presets
  config:
    default: physicist
# —— 插入 storage 三件套（headless bundle 无 Web 层，需自行提供存储）——
- insert:
    - id: storage
      name: '@deepseek-ai/dsh-storage'
      config:
        default: standard
    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')
    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json
# —— 插入 Aemeath 插件 ——
- insert:
    - id: aemeath-common
      name: '@aemeath/dsh-plugin-common'
      config:
        defaultPreset: 'physicist'
        personas:
          aemeath:
            file: 'profiles/aemeath/personas/aemeath.md'
          physicist:
            file: 'profiles/aemeath/personas/physicist.md'
        oocRules:
          aemeath:
            forbidPatterns:
              - '根据研究'
              - '科学表明'
              - '数据显示'
              - '牛顿'
              - '焦耳'
              - '库仑'
          physicist:
            forbidPatterns:
              - '嘤嘤嘤'
              - '人家'
              - '好哒'
              - '喵~'
              - 'Ciallo'
    - id: aemeath-worldbook
      name: '@aemeath/dsh-plugin-worldbook'
      config:
        defaultPreset: 'physicist'
        libraries:
          physicist: 'packages/worldbook/data/physicist'
          aemeath: 'packages/worldbook/data/aemeath'
        maxInjectTokens: 3000
        hotReloadInterval: 3
    - id: aemeath-retriever
      name: '@aemeath/dsh-plugin-retriever'
      config:
        defaultPreset: 'physicist'
        notesDir: 'packages/library/physicist/notes'
        maxInjectTokens: 1500
    - id: aemeath-workflow
      name: '@aemeath/dsh-plugin-workflow'
      config:
        defaultPreset: 'physicist'
        planScratch: true
        verifyBudget: 3
        dimensionCheck: true
        codeMode: false
    - id: aemeath-memory
      name: '@aemeath/dsh-plugin-memory'
      config:
        defaultPreset: 'physicist'
        l2RecallTopK: 5
        l3Capacity: 500
        l1Capacity: 40
        l1Threshold: 0.8
        decayDays: 90
        llm:
          enabled: false
          apiKey: ''
          baseUrl: 'https://api.deepseek.com'
          model: 'deepseek-v4-flash'
          batchSize: 8
          minBatch: 4
        knowledge:
          enabled: true
        worldbook:
          enabled: false
          libraries:
            physicist: 'packages/worldbook/data/physicist'
            aemeath: 'packages/worldbook/data/aemeath'
        adminHttp:
          enabled: false
          port: 18895
    # —— Python 微服务（headless 只挂轻量：sympy 计算 + control；vision/tts 重依赖
    #    每问一次进程拉起成本高，不挂——基准按 physicist 纯知识/检索/计算作答）——
    - id: mcp-sympy
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: sympy
        command: python
        args: ['packages/py-services/sympy_mcp/server.py']
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 60000
        failOnStartupError: false
    - id: mcp-control
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: control
        command: python
        args: ['packages/py-services/control_mcp/server.py']
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 30000
        failOnStartupError: false
