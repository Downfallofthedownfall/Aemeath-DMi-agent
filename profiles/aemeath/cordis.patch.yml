# ============================================================
# profiles/aemeath/cordis.patch.yml — Aemeath 主 profile（Web UI）
# 双角色由 agent presets 承载（.dsh-home/.agent-presets/{aemeath,physicist}，
# 由 scripts/dsh.ps1 同步）；本层只插入公共/世界书插件。
# 注：路径相对仓库根（scripts/dsh.ps1 固定 cwd）
# ============================================================
# —— 插入 Aemeath 插件 ——
- insert:
    - id: aemeath-common
      name: '@aemeath/dsh-plugin-common'
      config:
        # C8：与 aemeath-run 保持一致显式声明 defaultPreset（主 profile 默认小爱同学）
        defaultPreset: 'aemeath'
        personas:
          aemeath:
            file: 'profiles/aemeath/personas/aemeath.md'
          physicist:
            file: 'profiles/aemeath/personas/physicist.md'
        oocRules:
          aemeath:
            forbidPatterns:
              - '根据研究'
              - '科学表明'
              - '数据显示'
              - '牛顿'
              - '焦耳'
              - '库仑'
          physicist:
            forbidPatterns:
              - '嘤嘤嘤'
              - '人家'
              - '好哒'
              - '喵~'
              - 'Ciallo'
        oocLlm:
          enabled: false
          apiKey: ''
          baseUrl: 'https://api.deepseek.com'
          model: 'deepseek-v4-flash'
    - id: aemeath-worldbook
      name: '@aemeath/dsh-plugin-worldbook'
      config:
        defaultPreset: 'aemeath'
        libraries:
          physicist: 'packages/worldbook/data/physicist'
          aemeath: 'packages/worldbook/data/aemeath'
        maxInjectTokens: 3000
        hotReloadInterval: 3
    - id: aemeath-retriever
      name: '@aemeath/dsh-plugin-retriever'
      config:
        defaultPreset: 'aemeath'
        notesDir: 'packages/library/physicist/notes'
        maxInjectTokens: 1500
    - id: aemeath-memory
      name: '@aemeath/dsh-plugin-memory'
      config:
        defaultPreset: 'aemeath'
        l2RecallTopK: 5
        l3Capacity: 500
        l1Capacity: 40
        l1Threshold: 0.8
        decayDays: 90
        llm:
          # C9：enabled=true 但 apiKey 留空 = 运行时经 ctx.credentials 回退到
          # DEEPSEEK_API_KEY（.dsh-home/.credentials.yaml / 环境变量）；交互 profile
          # 开 LLM 总结层，headless 基准 profile 关（见 aemeath-run）——差异是有意的
          enabled: true
          apiKey: ''
          baseUrl: 'https://api.deepseek.com'
          model: 'deepseek-v4-flash'
          batchSize: 8
          minBatch: 4
        knowledge:
          enabled: true
        worldbook:
          # C8：桥接开关只留 enabled；preset→馆目录映射由 worldbook 插件提供
          #（memory 经 worldbook service 读取，不再在此重复 libraries）
          enabled: true
        adminHttp:
          enabled: true
          port: 18895
    - id: aemeath-workflow
      name: '@aemeath/dsh-plugin-workflow'
      config:
        defaultPreset: 'aemeath'
        planScratch: true
        verifyBudget: 3
        dimensionCheck: true
        codeMode: false
    # —— M5 前端 UI 插件（browser 半区经 dsh.client 声明进入 __DSH_BOOT__）——
    - id: aemeath-ui
      name: '@aemeath/dsh-plugin-ui'
    # —— Python 微服务（v1 迁移 → MCP 接入；cwd 相对仓库根，dsh.ps1 固定）——
    - id: mcp-sympy
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: sympy
        command: python
        args: ['packages/py-services/sympy_mcp/server.py']
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 60000
        # C3：sympy 是核心计算依赖，启动失败要暴露（pip install -r requirements.txt）
        failOnStartupError: true
    - id: mcp-vision
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: vision
        command: python
        args: ['packages/py-services/vision_mcp/server.py']
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 180000
        failOnStartupError: false
    - id: mcp-tts
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: tts
        # C7 补全：command 用 PATH 上的 python（setup.bat 已校验），解释器与模型目录
        # 全部经环境变量接线（mcp-client 的 env 继承父进程环境）：
        #   AEMEATH_TTS_PYTHON    → IndexTTS venv python（tts_mcp 启动时 execv 换入）
        #   AEMEATH_TTS_MODEL_DIR → 模型目录（server.py 读取）
        # 未设置时回退 D:\index-tts（仅代码内一处兜底）；换机器只改环境变量即可
        command: python
        args: ['packages/py-services/tts_mcp/server.py']
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 300000
        failOnStartupError: false
    - id: mcp-control
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: control
        # C10：command 依赖 PATH 上的 python（setup.bat 已校验）；如需固定解释器
        # 可改 AEMEATH_TTS_PYTHON 同款环境变量方案
        command: python
        args: ['packages/py-services/control_mcp/server.py']
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 30000
        failOnStartupError: false
# —— 覆盖 web-app 的 agent-presets 行（同 id 顶层行 = 覆盖 config）：
#    默认 preset 改为 aemeath（爱弥斯桌宠），而非 dsh 默认 standard（code agent）——
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: aemeath
# —— 禁用与爱弥斯无关的官方 UI 插件（去掉 dsh 开发工具痕迹）——
- id: ui-agent-preset
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-skill
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-plan
  disabled: true
- id: ui-trajectory
  disabled: true
- id: ui-deliverables
  disabled: true
- id: ui-cordis
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
# 官方 models 设置页/DeepSeek onboarding 弹窗：由我们的「爱弥斯」设置页（API key 表单）替代
- id: ui-settings-models
  disabled: true
