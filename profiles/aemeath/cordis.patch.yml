# ============================================================
# profiles/aemeath/cordis.patch.yml — Aemeath 主 profile（Web UI）
# 双角色由 agent presets 承载（.dsh-home/.agent-presets/{aemeath,physicist}，
# 由 scripts/dsh.ps1 同步）；本层只插入公共/世界书插件。
# 注：路径相对仓库根（scripts/dsh.ps1 固定 cwd）
# ============================================================
# —— 插入 Aemeath 插件 ——
- insert:
    - id: aemeath-common
      name: '@aemeath/dsh-plugin-common'
      config:
        personas:
          aemeath:
            file: 'profiles/aemeath/personas/aemeath.md'
          physicist:
            file: 'profiles/aemeath/personas/physicist.md'
        oocRules:
          aemeath:
            forbidPatterns:
              - '根据研究'
              - '科学表明'
              - '数据显示'
              - '牛顿'
              - '焦耳'
              - '库仑'
          physicist:
            forbidPatterns:
              - '嘤嘤嘤'
              - '人家'
              - '好哒'
              - '喵~'
              - 'Ciallo'
        oocLlm:
          enabled: false
          apiKey: ''
          baseUrl: 'https://api.deepseek.com'
          model: 'deepseek-v4-flash'
    - id: aemeath-worldbook
      name: '@aemeath/dsh-plugin-worldbook'
      config:
        libraries:
          physicist: 'packages/worldbook/data/physicist'
          aemeath: 'packages/worldbook/data/aemeath'
        maxInjectTokens: 3000
        hotReloadInterval: 3
    - id: aemeath-retriever
      name: '@aemeath/dsh-plugin-retriever'
      config:
        notesDir: 'packages/library/physicist/notes'
        maxInjectTokens: 1500
    - id: aemeath-memory
      name: '@aemeath/dsh-plugin-memory'
      config:
        l2RecallTopK: 5
        l3Capacity: 500
        l1Capacity: 40
        l1Threshold: 0.8
        decayDays: 90
        llm:
          enabled: true
          apiKey: ''
          baseUrl: 'https://api.deepseek.com'
          model: 'deepseek-v4-flash'
          batchSize: 8
          minBatch: 4
        knowledge:
          enabled: true
        worldbook:
          enabled: true
          libraries:
            physicist: 'packages/worldbook/data/physicist'
            aemeath: 'packages/worldbook/data/aemeath'
        adminHttp:
          enabled: true
          port: 18895
    - id: aemeath-workflow
      name: '@aemeath/dsh-plugin-workflow'
      config:
        planScratch: true
        verifyBudget: 3
        dimensionCheck: true
        codeMode: false
    # —— M5 前端 UI 插件（browser 半区经 dsh.client 声明进入 __DSH_BOOT__）——
    - id: aemeath-ui
      name: '@aemeath/dsh-plugin-ui'
    # —— Python 微服务（v1 迁移 → MCP 接入；cwd 相对仓库根，dsh.ps1 固定）——
    - id: mcp-sympy
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: sympy
        command: python
        args: ['packages/py-services/sympy_mcp/server.py']
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 60000
        failOnStartupError: false
    - id: mcp-vision
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: vision
        command: python
        args: ['packages/py-services/vision_mcp/server.py']
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 180000
        failOnStartupError: false
    - id: mcp-tts
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: tts
        command: 'D:\index-tts\.venv\Scripts\python.exe'
        args: ['packages/py-services/tts_mcp/server.py', '--model-dir', 'D:\index-tts']
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 300000
        failOnStartupError: false
    - id: mcp-control
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: control
        command: python
        args: ['packages/py-services/control_mcp/server.py']
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 30000
        failOnStartupError: false
# —— 覆盖 web-app 的 agent-presets 行（同 id 顶层行 = 覆盖 config）：
#    默认 preset 改为 aemeath（爱弥斯桌宠），而非 dsh 默认 standard（code agent）——
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: aemeath
# —— 禁用与爱弥斯无关的官方 UI 插件（去掉 dsh 开发工具痕迹）——
- id: ui-agent-preset
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-skill
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-plan
  disabled: true
- id: ui-trajectory
  disabled: true
- id: ui-deliverables
  disabled: true
- id: ui-cordis
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
# 官方 models 设置页/DeepSeek onboarding 弹窗：由我们的「爱弥斯」设置页（API key 表单）替代
- id: ui-settings-models
  disabled: true
