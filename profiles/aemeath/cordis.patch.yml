# ============================================================
# profiles/aemeath/cordis.patch.yml — Aemeath 主 profile（Web UI）
# 双角色由 agent presets 承载（.dsh-home/.agent-presets/{aemeath,physicist}，
# 由 scripts/dsh.ps1 同步）；本层只插入公共/世界书插件。
# 注：路径相对仓库根（scripts/dsh.ps1 固定 cwd）
# ============================================================
# —— 插入 Aemeath 插件 ——
- insert:
    - id: aemeath-common
      name: '@aemeath/dsh-plugin-common'
      config:
        # C8：与 aemeath-run 保持一致显式声明 defaultPreset（主 profile 默认小爱同学）
        defaultPreset: 'aemeath'
        # DSH 0.2.0 volatile：设置页可改、热更新即时生效（原 installSettingsSection 用户层）
        oocRulesEnabled: true
        oocLlmEnabled: false
        personas:
          aemeath:
            file: 'profiles/aemeath/personas/aemeath.md'
          physicist:
            file: 'profiles/aemeath/personas/physicist.md'
        oocRules:
          aemeath:
            forbidPatterns:
              - '根据研究'
              - '科学表明'
              - '数据显示'
              - '牛顿'
              - '焦耳'
              - '库仑'
          physicist:
            forbidPatterns:
              - '嘤嘤嘤'
              - '人家'
              - '好哒'
              - '喵~'
              - 'Ciallo'
        oocLlm:
          enabled: false
          apiKey: ''
          baseUrl: 'https://api.deepseek.com'
          model: 'deepseek-v4-flash'
    - id: aemeath-worldbook
      name: '@aemeath/dsh-plugin-worldbook'
      config:
        defaultPreset: 'aemeath'
        libraries:
          physicist: 'packages/worldbook/data/physicist'
          aemeath: 'packages/worldbook/data/aemeath'
        maxInjectTokens: 3000
        hotReloadInterval: 3
        enabled: true
    - id: aemeath-retriever
      name: '@aemeath/dsh-plugin-retriever'
      config:
        defaultPreset: 'aemeath'
        notesDir: 'packages/library/physicist/notes'
        maxInjectTokens: 1500
        enabled: true
    - id: aemeath-memory
      name: '@aemeath/dsh-plugin-memory'
      config:
        defaultPreset: 'aemeath'
        enabled: true
        l2RecallTopK: 5
        l3Capacity: 500
        l1Capacity: 40
        l1Threshold: 0.8
        decayDays: 90
        # T3 空闲整合（借 ripples-of-aion autoDream）：空闲 30 分钟把已有记忆整合成
        # 「主题簇 + 疑似矛盾」洞察，写入独立存储（绝不改写原记忆）
        consolidate:
          enabled: true
          idleMinutes: 30
          maxRecords: 80
          minRecords: 5
        llm:
          # C9：enabled=true 但 apiKey 留空 = 运行时经 ctx.credentials 回退到
          # DEEPSEEK_API_KEY（.dsh-home/.credentials.yaml / 环境变量）；交互 profile
          # 开 LLM 总结层，headless 基准 profile 关（见 aemeath-run）——差异是有意的
          enabled: true
          apiKey: ''
          baseUrl: 'https://api.deepseek.com'
          model: 'deepseek-v4-flash'
          batchSize: 8
          minBatch: 4
        knowledge:
          enabled: true
        worldbook:
          # C8：桥接开关只留 enabled；preset→馆目录映射由 worldbook 插件提供
          #（memory 经 worldbook service 读取，不再在此重复 libraries）
          enabled: true
        adminHttp:
          enabled: true
          port: 18895
    - id: aemeath-workflow
      name: '@aemeath/dsh-plugin-workflow'
      config:
        defaultPreset: 'aemeath'
        planScratch: true
        verifyBudget: 3
        dimensionCheck: true
        codeMode: false
    - id: aemeath-curriculum
      name: '@aemeath/dsh-plugin-curriculum'
      config:
        enabled: true
        defaultPreset: 'physicist'
        modulhandbuchFile: 'packages/library/physicist/modulhandbuch.json'
        currentSemester: ''
        injectTokens: 800
    # —— Lecture Mode 课堂记录模式（D9：可从主 agent 内启动）——
    #    为什么挂在主 profile：用户要求"主程序前端里要有入口"。
    #    挂上后侧边栏出现「课堂」胶囊按钮（client 半区注册 sidebar.footer.action），
    #    点击打开 shell.overlay 全屏课堂界面。
    #
    #    与独立 lecture profile 的关系：**同一份插件、同一份数据目录**，
    #    不是两套实现。独立 profile 的优势是"可脱离主 agent 在 mac 上跑"；
    #    主 profile 里挂上则是"在 Windows 全面版里也能用"。
    #
    #    隔离性说明（D2）：本插件不注入 memory 召回 / worldbook / retriever /
    #    curriculum / workflow 的任何注入链——它在主 profile 里只是**多了几个
    #    工具 + 一个 overlay 界面**，不会污染主 agent 的对话上下文。
    #    唯一的交互是 lecture_import_handoff（握手接收侧），那是显式的人工动作。
    - id: aemeath-lecture
      name: '@aemeath/dsh-plugin-lecture'
      config:
        defaultPreset: 'physicist'
        enabled: true
        dataDir: 'packages/library/physicist/lectures'
        transcribe: true
        handoffDir: 'packages/library/physicist/lectures'
        exportToNotes: false
        notesDir: 'packages/library/physicist/notes'
        llm:
          apiKey: ''
          baseUrl: 'https://api.deepseek.com'
          model: 'deepseek-v4-flash'
    # —— M5 前端 UI 插件（browser 半区经 dsh.client 声明进入 __DSH_BOOT__）——
    - id: aemeath-ui
      name: '@aemeath/dsh-plugin-ui'
      config:
        # DSH 0.2.0 volatile：前端上报的 locale + TTS 开关（原 aemeath-ui / aemeath-tts 两个命名空间）
        locale: ''
        ttsEnabled: false
        ttsVolume: 1
    # —— Python 微服务（v1 迁移 → MCP 接入；cwd 相对仓库根，dsh.ps1 固定）——
    - id: mcp-sympy
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: sympy
        command: python
        args: [ 'packages/py-services/sympy_mcp/server.py' ]
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 60000
        # C3：sympy 是核心计算依赖，启动失败要暴露（pip install -r requirements.txt）
        failOnStartupError: true
    - id: mcp-vision
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: vision
        command: python
        args: [ 'packages/py-services/vision_mcp/server.py' ]
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 180000
        failOnStartupError: false
    - id: mcp-tts
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: tts
        # ⚠ 2026-10-10 修复：**必须直接用 IndexTTS venv 的 python 启动**，
        # 不能再依赖 server.py 里的 `_maybe_relaunch()`（os.execv 同进程换入）。
        #
        # 原因（实测证据，见 docs/DSH_0.2.0_MIGRATION.md §6.2）：
        #   用系统 python 启动 → server.py 走 os.execv 换入 IndexTTS venv；
        #   在 Windows 上父进程传给它的 stdio **管道句柄活不过 execv**，
        #   结果进程能打印 banner、却**永不响应 MCP initialize 握手**。
        #   mcp-client 的初始化 promise 因此永不 settle → 拖住整个 Loader
        #   → web-runtime 的认证 URL 那行永不打印 → Electron 拿不到 token
        #   → 窗口 401、同时 dsh 自己弹出系统浏览器。
        #
        # 直接用目标解释器启动就完全绕开这条路径（实测握手正常）。
        # 换机器只改这一行 command（或设 AEMEATH_TTS_PYTHON 后同步这里）。
        command: 'D:\index-tts\.venv\Scripts\python.exe'
        args: [ 'packages/py-services/tts_mcp/server.py' ]
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 300000
        failOnStartupError: false
    - id: mcp-control
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: control
        # C10：command 依赖 PATH 上的 python（setup.bat 已校验）；如需固定解释器
        # 可改 AEMEATH_TTS_PYTHON 同款环境变量方案
        command: python
        args: [ 'packages/py-services/control_mcp/server.py' ]
        cwd: '.'
        env: {}
        toolCallTimeoutMs: 30000
        failOnStartupError: false
# —— 覆盖 web-app 的 agent-preset-registry 行（同 id 顶层行 = 覆盖 config）：
#    默认 preset 改为 aemeath（爱弥斯桌宠），而非 dsh 默认 standard（code agent）。
#    注（DSH 0.2.0）：0.1.1 的 '@deepseek-ai/dsh-agent-presets' 已拆分为
#    dsh-agent-preset（插件类）+ dsh-agent-preset-registry（registry 服务）；
#    web-app bundle 里的行 id 也随之改名为 agent-preset-registry ——
#    旧的 id/name 在 0.2.0 下会因找不到行/包而加载失败。——
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: aemeath
    selectedDefault: physicist

# —— 声明 aemeath / physicist 两个 preset 本体 ——
#
# ⚠️⚠️ 真机踩过（"以前能用，突然 Unknown agent preset: physicist"）：
#
#   DSH **0.1.1** 时代，主 profile 挂的是 `@deepseek-ai/dsh-agent-presets`，
#   那个包会**自动扫描 `$DSH_HOME/.agent-presets/` 目录** ——
#   所以当时的配置里看不到任何 preset 声明，却能用。
#
#   DSH **0.2.0** 把它拆成了「dsh-agent-preset（插件类）」+
#   「dsh-agent-preset-registry（注册表服务）」。升级时只把**行 id 改了名**
#   （agent-presets → agent-preset-registry），**扫描目录的机制随之消失**，
#   但没有任何地方补上 preset 声明。
#
#   后果：`default: aemeath` 和 `defaultPreset: 'physicist'` 全都指不到东西。
#   平时不报错（新建会话时 registry 找不到 preset 才报），
#   所以**潜伏了很久** —— 直到某个会话缓存里钉了 `physicist` 才暴露：
#       agent-preset/not-found: Unknown agent preset: physicist
#
#   注意 `.dsh-home/.agent-presets/` 目录和 `scripts/dsh.ps1` 的同步逻辑
#   **现在都是死代码**（0.2.0 没人读那个目录），保留只是为了不破坏其他引用。
#
#   正确做法（照 dsh-web-app/presets/*.patch.yml 的写法）：
#   每个 preset 一个 `@deepseek-ai/dsh-agent-preset` 条目。
- insert:
    # 爱弥斯桌宠（陪伴 / 情感 / 日常）——主 profile 的默认角色
    - id: preset-aemeath
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aemeath
        name: 爱弥斯
        description: 爱弥斯桌宠：陪伴、日常、情感向对话
        order: 10
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

    # 拉贝尔学部学霸（物理学习引擎）
    # ⚠️ lecture 插件与 curriculum 都写 `defaultPreset: 'physicist'`，
    #    缺了这个声明它们全部指不到东西。
    - id: preset-physicist
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: physicist
        name: 爱弥斯-拉贝尔学部学霸
        description: 物理学习模式：引导式讲解、推导、复盘
        order: 20
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

# —— 禁用与爱弥斯无关的官方 UI 插件（去掉 dsh 开发工具痕迹）——
#
# ⚠️⚠️ `ui-agent-preset` **不能禁用**（真机踩过两次）：
#
#   它看起来像"dsh 开发工具"，其实是**人格选择器的唯一提供者**：
#     · conversation.hero.agentPreset      —— 欢迎屏上方的人格模态
#     · conversation.session.header.actions —— 会话头部操作
#     · byId.agentPreset                   —— 会话列表每行的人格标签
#                                            （历史记录里显示"学霸/小爱同学"）
#   以及 settings.section。
#
#   禁用它之后的两个症状（用户先报第一个、后报第二个）：
#     ① "preset 按钮点不了" —— 切换人格的 UI 根本不存在；
#     ② "前端上方模态锁在学霸" / "历史记录模态显示也没有" ——
#        槽位没人建，aemeath-ui 往 `conversation.hero.agentPreset` 的注册
#        全部落空；会话列表读的 `byId.agentPreset` 也没人填。
#
#   当时禁用的理由写的是"去掉 dsh 开发工具痕迹" ——
#   但它提供的正是我们**需要**的那个 UI。已改为启用。
- id: ui-agent-preset
  disabled: false
- id: ui-jobs
  disabled: true
- id: ui-skill
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-plan
  disabled: true
- id: ui-trajectory
  disabled: true
- id: ui-deliverables
  disabled: true
- id: ui-cordis
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
# —— 定制权限预设：danger-full-access 的 approval 由 never 改为 ask ——
# dsh 默认把 danger-full-access 配成 approval: never（无人值守/CI 语义：一切
# 需要审批的操作确定性拒绝）。结果是"完全访问"反而静默拒绝服务——例如
# mcp__control__* 键鼠/程序控制被 aemeath-common 强制 tools/pre-execute ask，
# full access 下直接 rejected（用户观察到的"mcp 输入被拒"）。
# 本地交互桌宠永远有人在：期望语义是"沙箱全开 + 弹窗确认"。故覆盖该预设为 ask
#（presets 为整体替换，须写全 read-only / workspace-write / danger-full-access）。
# 注意：已切过 old 预设的会话持有事件日志里的旧 override，需新会话重新选一次预设。
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: ask
# —— 重新启用文件系统工具（web-app bundle 默认禁用 tool-fs/tool-fs-search——
#     学习场景需要读写工作区文件（笔记/资料）：read / write / edit / read_image
#     + glob / grep。读写受沙箱约束：workspace-write 仅限工作区，danger-full-access
#     全盘。bash/pwsh 保持禁用（纯对话角色不暴露 shell）——
- id: tool-fs
  disabled: false
- id: tool-fs-search
  disabled: false
# —— 重新启用 dsh 网络搜索工具链（web-app bundle 默认禁用 tool-web——
#     导致主 profile 的 agent 看不到 web_search 工具，只会用 web_scraper 抓搜索页被反爬；
#     provider web-search-deepseek 已在 base 启用（复用 DEEPSEEK_API_KEY）——
#     tool-web 恢复后 web_search/web_fetch 工具对 agent 可见）——
- id: tool-web
  disabled: false
# —— 重新启用 dsh skill 机制（web-app bundle 默认禁用 skill-filesystem/tool-skill；
#     本项目用 skill 承载联网搜索行为指南：.dsh/skills/web-search.md——
#     指导 agent 联网搜索一律走 dsh 内置 web_search 工具，不用 web_scraper 抓
#     搜索引擎结果页（会被反爬拦截）。headless profile 默认启用，主 profile 需在此恢复）——
- id: skill-filesystem
  disabled: false
- id: tool-skill
  disabled: false
- id: aemeath-ui
  name: "@aemeath/dsh-plugin-ui"
  config:
    locale: zh
    ttsEnabled: false
    ttsVolume: 1
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh

# 2026-08-17：重新启用官方 models 设置页（用户要求加回 dsh 自带 responses/messages 接口）——
# 我们的「爱弥斯」设置页只做 API key 快捷填写，模型/provider 配置回到官方 Models 页
